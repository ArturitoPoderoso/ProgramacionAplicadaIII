<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ferretería Jessmi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="dashboard.css?v=20261031_v3">
</head>
<body>
    <div class="app-container">
        <!-- Barra Lateral (Sidebar) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="ph-fill ph-gear sidebar-logo-icon"></i>
                <div class="sidebar-brand">
                    <span>Ferretería</span>
                    <span>JESSMI</span>
                </div>
                <i class="ph ph-list menu-toggle" id="menu-toggle"></i>
            </div>
            
            <nav class="sidebar-nav">
                <div class="nav-group" id="nav-seguridad">
                    <a href="#" class="nav-item active-group" id="btn-seguridad">
                        <i class="ph-fill ph-user"></i>
                        <span>Seguridad</span>
                        <i class="ph ph-caret-down ml-auto"></i>
                    </a>
                    <div class="nav-subgroup" id="subgroup-seguridad">
                        <a href="#" onclick="showSection('section-usuarios')" class="nav-subitem active">Usuarios</a>
                        <a href="#" onclick="showSection('section-perfil')" class="nav-subitem">Mi Perfil</a>
                    </div>
                </div>

                <a href="#" onclick="showSection('section-perfil')" class="nav-item" id="nav-mi-perfil-vendedor" style="display: none;">
                    <i class="ph-fill ph-user-circle"></i>
                    <span>Mi Perfil</span>
                </a>

                <a href="#" onclick="showSection('section-productos')" class="nav-item" id="nav-productos">
                    <i class="ph-fill ph-cube"></i>
                    <span>Productos</span>
                </a>
                
                <a href="#" onclick="showSection('section-ventas')" class="nav-item" id="nav-ventas">
                    <i class="ph-fill ph-chart-line-up"></i>
                    <span>Caja / Ventas</span>
                </a>

                <a href="#" onclick="showSection('section-proformas')" class="nav-item" id="nav-proformas" style="display: none;">
                    <i class="ph-fill ph-file-text"></i>
                    <span>Cotizaciones / Proformas</span>
                </a>

                <a href="#" onclick="showSection('section-historial-ventas')" class="nav-item" id="nav-historial-ventas" style="display: none;">
                    <i class="ph-fill ph-clock-counter-clockwise"></i>
                    <span>Historial de Ventas</span>
                </a>

                <a href="#" onclick="showSection('section-promociones')" class="nav-item" id="nav-promociones" style="display: flex;">
                    <i class="ph-fill ph-tag"></i>
                    <span>Descuentos y Promociones</span>
                </a>
                
                <a href="#" class="nav-item" id="nav-clientes" onclick="showSection('section-clientes')">
                    <i class="ph-fill ph-users"></i>
                    <span>Clientes</span>
                </a>
                
                <div class="nav-group" id="nav-compras-group">
                    <a href="#" class="nav-item" id="btn-compras">
                        <i class="ph-fill ph-shopping-cart"></i>
                        <span>Compras</span>
                        <i class="ph ph-caret-down ml-auto"></i>
                    </a>
                    <div class="nav-subgroup" id="subgroup-compras">
                        <a href="#" onclick="showSection('section-emitir-orden')" class="nav-subitem" id="nav-sub-emitir-orden">Emitir Orden</a>
                        <a href="#" onclick="showSection('section-historial-compras')" class="nav-subitem" id="nav-sub-historial-compras">Historial Compras</a>
                    </div>
                </div>
                
                <a href="#" class="nav-item" id="nav-proveedores" onclick="showSection('section-proveedores')">
                    <i class="ph-fill ph-truck"></i>
                    <span>Proveedores</span>
                </a>
            </nav>
        </aside>

        <!-- Contenedor Principal (Main Content) -->
        <main class="main-content" id="main-app-content">
            <!-- Barra Superior (Topbar) -->
            <header class="topbar">
                <h1 class="page-title" id="global-page-title">SISTEMA JESMI</h1>
                <div class="user-profile" onclick="document.getElementById('user-dropdown').classList.toggle('show')">
                    <div class="avatar">
                        <img src="https://ui-avatars.com/api/?name=User&background=random" alt="Avatar" id="topbar-avatar">
                    </div>
                    <div class="user-info">
                        <span class="user-name" id="display-username">Cargando...</span>
                    </div>
                    
                    <div class="user-dropdown" id="user-dropdown">
                        <button onclick="cerrarSesion()">
                            <i class="ph ph-sign-out"></i> Cerrar Sesión
                        </button>
                    </div>
                </div>
            </header>

            <!-- Viewport Dinámico: Las vistas modulares de views/*.html se cargan aquí -->
            <div id="router-viewport">
                <div style="padding: 40px; text-align: center; color: #64748b;">
                    <i class="ph-bold ph-spinner" style="font-size: 2rem; animation: spin 1s linear infinite;"></i>
                    <p style="margin-top: 10px; font-weight: 600;">Cargando interfaz...</p>
                </div>
            </div>
        </main>
    </div>

    <!-- Contenedor Dinámico: Los modales de modals/*.html se montan aquí -->
    <div id="modals-container"></div>

    <!-- Scripts y Controladores del Sistema -->
    <script src="config.js"></script>
    <script src="dashboard.js?v=20261031_v3"></script>
    <script src="almacen.js?v=20261031_v3"></script>
    <script src="caja.js?v=20261031_v3"></script>
    <script src="historial_ventas.js?v=20261031_v3"></script>
    <script src="proformas.js?v=20261031_v3"></script>
    <script src="promociones.js?v=20261031_v3"></script>
    <script src="clientes.js?v=20261031_v3"></script>
    <script src="proveedores.js?v=20261031_v3"></script>
    <script src="compras.js?v=20261031_v3"></script>
    
    <!-- Enrutador Modular SPA -->
    <script src="router.js?v=20261031_v3"></script>
</body>
</html>
