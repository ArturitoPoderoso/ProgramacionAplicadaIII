<div class="modal-overlay" id="modal-promocion">
        <div class="modal-container" style="max-width: 500px; border-radius: 12px;">
            <div class="modal-header">
                <h3 style="display: flex; align-items: center; gap: 8px;">
                    <i class="ph-fill ph-tag" style="color: #6366f1;"></i> <span id="modal-promocion-title">Nueva Campaña de Promoción</span>
                </h3>
                <button class="modal-close" onclick="closeModal('modal-promocion')"><i class="ph ph-x"></i></button>
            </div>
            <form id="form-promocion" onsubmit="guardarPromocion(event)">
                <div class="modal-body" style="display: flex; flex-direction: column; gap: 12px; padding: 15px 20px;">
                    <div class="form-group">
                        <label style="font-weight: 700; font-size: 0.85rem;">Nombre de la Campaña *</label>
                        <input type="text" id="promo-nombre" placeholder="Ej: Oferta Navideña, Remate Fiestas Patrias" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label style="font-weight: 700; font-size: 0.85rem;">Tipo Descuento *</label>
                            <select id="promo-tipo" class="form-select" style="width: 100%; padding: 8px; border-radius: 6px;">
                                <option value="PORCENTAJE">Porcentaje (%)</option>
                                <option value="MONTO_FIJO">Monto Fijo (S/)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label style="font-weight: 700; font-size: 0.85rem;">Valor del Descuento *</label>
                            <input type="number" step="0.01" min="0.1" id="promo-valor" placeholder="Ej: 10 para 10%" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
                        </div>
                    </div>

                    <div class="form-group">
                        <label style="font-weight: 700; font-size: 0.85rem;">Aplica a *</label>
                        <select id="promo-aplica" class="form-select" style="width: 100%; padding: 8px; border-radius: 6px;" onchange="togglePromoFiltros()">
                            <option value="TODOS">Todos los Productos de la Tienda</option>
                            <option value="CATEGORIA">Categoría Específica</option>
                            <option value="PRODUCTO">Producto Específico</option>
                        </select>
                    </div>

                    <div class="form-group" id="group-promo-categoria" style="display: none;">
                        <label style="font-weight: 700; font-size: 0.85rem;">Seleccionar Categoría *</label>
                        <select id="promo-categoria" class="form-select" style="width: 100%; padding: 8px; border-radius: 6px;">
                            <option value="">Cargando categorías...</option>
                        </select>
                    </div>

                    <div class="form-group" id="group-promo-producto" style="display: none;">
                        <label style="font-weight: 700; font-size: 0.85rem;">Seleccionar Producto *</label>
                        <select id="promo-producto" class="form-select" style="width: 100%; padding: 8px; border-radius: 6px;">
                            <option value="">Cargando productos...</option>
                        </select>
                    </div>

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                        <div class="form-group">
                            <label style="font-weight: 700; font-size: 0.85rem;">Fecha Inicio *</label>
                            <input type="date" id="promo-fecha-inicio" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
                        </div>
                        <div class="form-group">
                            <label style="font-weight: 700; font-size: 0.85rem;">Fecha Fin *</label>
                            <input type="date" id="promo-fecha-fin" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
                        </div>
                    </div>
                </div>
                <div class="modal-footer" style="padding: 12px 20px;">
                    <button type="button" class="btn-secondary" onclick="closeModal('modal-promocion')">Cancelar</button>
                    <button type="submit" class="btn-save" style="position: static; background: #6366f1;">Guardar Promoción</button>
                </div>
            </form>
        </div>
    </div>

<div class="modal-overlay" id="modal-autorizacion-supervisor">
        <div class="modal-container" style="max-width: 420px; border-radius: 12px;">
            <div class="modal-header" style="background: linear-gradient(135deg, #1e293b, #0f172a); color: white; padding: 14px 20px;">
                <h3 style="color: white; font-size: 1.05rem; display: flex; align-items: center; gap: 8px; margin: 0;">
                    <i class="ph-fill ph-lock-key" style="color: #f59e0b;"></i> Autorización de Supervisor
                </h3>
                <button class="modal-close" style="color: white;" onclick="closeModal('modal-autorizacion-supervisor')"><i class="ph ph-x"></i></button>
            </div>
            <form id="form-autorizacion-supervisor" onsubmit="validarAutorizacionSupervisor(event)">
                <div class="modal-body" style="padding: 20px; display: flex; flex-direction: column; gap: 14px;">
                    <p style="font-size: 0.85rem; color: #475569; margin: 0; background: #fef3c7; border-left: 4px solid #f59e0b; padding: 10px 12px; border-radius: 4px;">
                        ⚠️ Requiere credenciales de un <strong>Supervisor</strong> o <strong>Administrador</strong> para habilitar el descuento especial en esta venta.
                    </p>
                    <div class="form-group">
                        <label style="font-size: 0.82rem; font-weight: 700;">Usuario de Supervisor / Admin *</label>
                        <input type="text" id="sup-auth-user" placeholder="Ej: supervisor1" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
                    </div>
                    <div class="form-group">
                        <label style="font-size: 0.82rem; font-weight: 700;">Contraseña *</label>
                        <input type="password" id="sup-auth-pass" placeholder="••••••••" required style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #cbd5e1;">
                    </div>
                </div>
                <div class="modal-footer" style="padding: 12px 20px; background: #f8fafc;">
                    <button type="button" class="btn-secondary" onclick="closeModal('modal-autorizacion-supervisor')">Cancelar</button>
                    <button type="submit" class="btn-save" style="position: static; background: #f59e0b; color: #1e293b; font-weight: 800;">
                        <i class="ph-bold ph-key"></i> Autorizar Descuento
                    </button>
                </div>
            </form>
        </div>
    </div>
