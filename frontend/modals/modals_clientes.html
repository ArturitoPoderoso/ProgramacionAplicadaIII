<div class="modal-overlay" id="modal-cliente">
    <div class="modal-container" style="max-width: 560px; border-radius: 12px; overflow: hidden; padding: 0;">
        <div class="modal-header" style="background: linear-gradient(135deg, #0284c7, #0369a1); color: white; padding: 16px 20px;">
            <h3 id="modal-cliente-title" style="color: white; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; margin: 0;">
                <i class="ph-fill ph-user-plus"></i> Registrar Nuevo Cliente
            </h3>
            <button class="modal-close" style="color: white;" onclick="closeModal('modal-cliente')"><i class="ph ph-x"></i></button>
        </div>
        
        <div class="modal-body" style="padding: 22px; display: flex; flex-direction: column; gap: 14px;">
            <input type="hidden" id="edit-cliente-id">
            
            <div style="display: grid; grid-template-columns: 140px 1fr; gap: 12px;">
                <div class="form-group">
                    <label style="font-weight: 700; font-size: 0.82rem; color: #334155;">Tipo Doc. <span style="color: #ef4444;">*</span></label>
                    <select id="cli-tipo-doc" onchange="onCambioTipoDocumentoCliente()" style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.88rem; background: white; font-weight: 600;">
                        <option value="DNI">DNI</option>
                        <option value="RUC">RUC</option>
                        <option value="CE">Carnet Ext.</option>
                    </select>
                </div>

                <div class="form-group">
                    <label style="font-weight: 700; font-size: 0.82rem; color: #334155;">N° de Documento <span style="color: #ef4444;">*</span></label>
                    <input type="text" id="cli-numero-doc" maxlength="11" placeholder="Ej: 71234567" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem; font-family: monospace;">
                </div>
            </div>

            <div class="form-group">
                <label style="font-weight: 700; font-size: 0.82rem; color: #334155;">Nombres y Apellidos / Razón Social <span style="color: #ef4444;">*</span></label>
                <input type="text" id="cli-nombre" placeholder="Ej: Juan Perez o Constructora San Martin S.A.C." style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.9rem;">
            </div>

            <div class="form-group">
                <label style="font-weight: 700; font-size: 0.82rem; color: #334155;">Teléfono / Celular</label>
                <input type="text" id="cli-telefono" maxlength="12" placeholder="Ej: 987654321" style="width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.85rem;">
            </div>
        </div>

        <div class="modal-footer" style="padding: 14px 22px; background: #f8fafc; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 10px;">
            <button type="button" class="btn-secondary" onclick="closeModal('modal-cliente')">Cancelar</button>
            <button type="button" id="btn-guardar-cliente" onclick="guardarCliente()" class="btn-save" style="position: static; background: #0284c7; padding: 9px 22px; color: white;">Guardar Cliente</button>
        </div>
    </div>
</div>
