<div class="modal-overlay" id="modal-crear-usuario">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-crear-usuario-title">Crear Nuevo Usuario</h3>
                <button class="modal-close" onclick="closeModal('modal-crear-usuario')"><i class="ph ph-x"></i></button>
            </div>
            <div class="modal-body" style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <input type="hidden" id="edit-user-id">
                <div class="form-group">
                    <label>Nombres</label>
                    <input type="text" id="new-user-first-name" placeholder="Ej: Juan Pablo">
                </div>
                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" id="new-user-last-name" placeholder="Ej: Perez">
                </div>
                <div class="form-group">
                    <label>Usuario</label>
                    <input type="text" id="new-user-name" placeholder="Ej: Juan.p">
                </div>
                <div class="form-group">
                    <label>Correo</label>
                    <input type="email" id="new-user-email" placeholder="Ej: juan@jesmi.com">
                </div>
                <div class="form-group">
                    <label>Teléfono</label>
                    <input type="text" id="new-user-phone" placeholder="Ej: 999888777">
                </div>
                <div class="form-group">
                    <label>DNI</label>
                    <input type="text" id="new-user-dni" placeholder="Ej: 71234567">
                </div>
                <div class="form-group">
                    <label>Sexo</label>
                    <select class="form-select" id="new-user-gender">
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                    </select>
                </div>
                <div class="form-group" id="roles-checkbox-group">
                    <label>Roles (Puedes seleccionar varios)</label>
                    <div style="display: flex; gap: 10px; margin-top: 5px; font-size: 14px;">
                        <label style="display:flex; align-items:center; gap:5px; font-weight:normal;">
                            <input type="checkbox" name="user_roles" value="Administrador"> Administrador
                        </label>
                        <label style="display:flex; align-items:center; gap:5px; font-weight:normal;">
                            <input type="checkbox" name="user_roles" value="Supervisor"> Supervisor
                        </label>
                        <label style="display:flex; align-items:center; gap:5px; font-weight:normal;">
                            <input type="checkbox" name="user_roles" value="Vendedor"> Vendedor
                        </label>
                    </div>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Local/Sede</label>
                    <select class="form-select" id="new-user-location">
                        <option value="SJL">SJL</option>
                        <option value="Los Olivos">Los Olivos</option>
                        <option value="OLIVOS">OLIVOS</option>
                        <option value="INDEPENDENCIA">INDEPENDENCIA</option>
                        <option value="CARABAYLLO">CARABAYLLO</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('modal-crear-usuario')">Cancelar</button>
                <button class="btn-save" style="position:static" onclick="crearUsuario()">Guardar</button>
            </div>
        </div>
    </div>

<div class="modal-overlay" id="modal-accion">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modal-accion-title">Acción</h3>
                <button class="modal-close" onclick="closeModal('modal-accion')"><i class="ph ph-x"></i></button>
            </div>
            <div class="modal-body">
                <p>Por ahora esto es una simulación visual. Cuando conectemos el backend, esta acción se procesará correctamente.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('modal-accion')">Cerrar</button>
            </div>
        </div>
    </div>

<div class="modal-overlay" id="modal-eliminar">
        <div class="modal-container">
            <div class="modal-header">
                <h3>Eliminar Usuario</h3>
                <button class="modal-close" onclick="closeModal('modal-eliminar')"><i class="ph ph-x"></i></button>
            </div>
            <div class="modal-body">
                <p>¿Estás seguro que deseas eliminar a este usuario?</p>
                <input type="hidden" id="delete-user-id">
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal('modal-eliminar')">Cancelar</button>
                <button class="btn-save" style="background-color: #E53935; position:static" onclick="eliminarUsuarioConfirmado()">Eliminar</button>
            </div>
        </div>
    </div>
