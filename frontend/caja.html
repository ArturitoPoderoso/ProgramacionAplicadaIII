<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caja - Ferretería Jessmi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="dashboard.css?v=3">
    <style>
        .pos-container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            height: calc(100vh - 120px);
        }
        .products-section, .cart-section {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            overflow-y: auto;
            margin-top: 15px;
        }
        .product-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .product-card:hover {
            border-color: #2563EB;
            background-color: #EFF6FF;
        }
        .prod-title { font-weight: 600; margin-bottom: 5px; font-size: 14px; }
        .prod-price { color: #2563EB; font-weight: 700; }
        .prod-stock { font-size: 12px; color: #666; margin-top: 5px; }
        
        .cart-items { flex: 1; overflow-y: auto; margin-bottom: 15px; }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .cart-item-info { flex: 1; }
        .cart-item-name { font-weight: 600; font-size: 14px; }
        .cart-item-qty { display: flex; align-items: center; gap: 10px; margin-top: 5px; }
        .qty-btn { background: #eee; border: none; width: 25px; height: 25px; border-radius: 4px; cursor: pointer; }
        .cart-total-section {
            border-top: 2px dashed #ddd;
            padding-top: 15px;
        }
        .total-row { display: flex; justify-content: space-between; font-size: 20px; font-weight: 800; margin-bottom: 15px; }
        .btn-cobrar { width: 100%; padding: 15px; font-size: 18px; }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="ph-fill ph-gear sidebar-logo-icon"></i>
                <div class="sidebar-brand">
                    <span>Ferretería</span>
                    <span>JESSMI</span>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="ph-fill ph-users"></i>
                    <span>Usuarios</span>
                </a>
                <a href="almacen.html" class="nav-item">
                    <i class="ph-fill ph-cube"></i>
                    <span>Almacén</span>
                </a>
                <a href="caja.html" class="nav-item active">
                    <i class="ph-fill ph-chart-line-up"></i>
                    <span>Caja / Ventas</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="topbar">
                <h1 class="page-title">PUNTO DE VENTA (CAJA)</h1>
                <div class="user-profile">
                    <div class="user-info">
                        <span class="user-name" id="display-username">Cargando...</span>
                    </div>
                </div>
            </header>

            <div class="dashboard-area" style="padding-top: 10px;">
                <div class="pos-container">
                    
                    <!-- Lado izquierdo: Productos -->
                    <div class="products-section">
                        <div class="search-box">
                            <i class="ph ph-magnifying-glass"></i>
                            <input type="text" id="search-pos" placeholder="Buscar producto o código de barras..." onkeyup="filtrarProductos()">
                        </div>
                        <div class="product-grid" id="product-grid">
                            <!-- Productos cargados dinamicamente -->
                        </div>
                    </div>

                    <!-- Lado derecho: Carrito -->
                    <div class="cart-section">
                        <h3 style="margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px;">Carrito de Ventas</h3>
                        <div class="cart-items" id="cart-items">
                            <div style="text-align:center; color:#888; margin-top:50px;">El carrito está vacío</div>
                        </div>
                        
                        <div class="cart-total-section">
                            <div class="form-group" style="margin-bottom: 10px;">
                                <label>Método de Pago</label>
                                <select class="form-select" id="metodo-pago">
                                    <option value="Efectivo">Efectivo</option>
                                    <option value="Tarjeta">Tarjeta (POS)</option>
                                    <option value="Yape/Plin">Yape / Plin</option>
                                </select>
                            </div>
                            <div class="total-row">
                                <span>TOTAL:</span>
                                <span id="cart-total">S/ 0.00</span>
                            </div>
                            <button class="btn-save btn-cobrar" onclick="procesarVenta()">Cobrar</button>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script src="caja.js"></script>
</body>
</html>
